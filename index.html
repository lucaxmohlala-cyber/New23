<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JUSTUS — Private Messenger</title>
<!-- Firebase SDKs (fully functional) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body {
  --bg: #f8f9fa;
  --panel-bg: #ffffff;
  --text: #0f172a;
  --text2: #64748b;
  --muted: #94a3b8;
  --border: #f1f5f9;
  --purple: #6d28d9;
  --purple-light: #f3e8ff;
  --pill-inactive: #f1f5f9;
  --msg-in: #f1f5f9;
  --msg-out: #f3e8ff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  width: 100vw;
  overflow: hidden;
  position: fixed;
  top:0; left:0;
}
.app{display:flex;flex-direction:column;height:100%;width:100%;background:var(--panel-bg);}
.content{flex:1;position:relative;height:100%;width:100%;}
.screen{display:none;flex-direction:column;height:100%;width:100%;position:absolute;top:0;left:0;background:var(--panel-bg);z-index:1;overflow-y:auto;}
.screen.show{display:flex;}
/* Login styles */
#sLogin{background:var(--purple);align-items:center;justify-content:center;padding:30px 20px;z-index:999;overflow-y:auto;}
.login-logo{text-align:center;margin-bottom:36px;}
.login-logo h1{font-size:44px;font-weight:900;color:#fff;letter-spacing:-1px;}
.login-logo p{font-size:12px;color:rgba(255,255,255,0.7);margin-top:4px;}
.login-card{background:#fff;border-radius:24px;padding:26px 22px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,0.2);}
.tabs{display:flex;background:#f5f5f5;border-radius:12px;padding:4px;margin-bottom:22px;gap:4px;}
.tab{flex:1;padding:9px;border-radius:9px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:#666;font-family:inherit;}
.tab.on{background:#fff;color:var(--purple);box-shadow:0 1px 4px rgba(0,0,0,0.12);}
.field{margin-bottom:13px;}
.field label{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:5px;}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #e0e0e0;font-size:15px;outline:none;font-family:inherit;color:#111;}
.field input:focus{border-color:var(--purple);}
.lbtn{width:100%;padding:14px;border-radius:14px;background:var(--purple);color:#fff;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px;}
.lerr{color:#e74c3c;font-size:13px;text-align:center;margin-top:8px;min-height:16px;}
/* Headers */
.hdr{padding:18px 20px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:calc(18px + env(safe-area-inset-top));}
.hdr-title-main{flex:1;font-size:24px;font-weight:700;color:var(--text);letter-spacing:-0.5px;}
.hdr-actions{display:flex;gap:20px;align-items:center;position:relative;}
.hdr-icon-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.hdr-icon-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;}
.chat-hdr{border-bottom:1px solid #f8f9fa;padding:12px 16px;display:flex;align-items:center;gap:12px;background:#fff;flex-shrink:0;}
.hdr-back{background:none;border:none;font-size:24px;cursor:pointer;width:32px;}
.hdr-av-container{position:relative;width:40px;height:40px;flex-shrink:0;}
.hdr-av-container img, .hdr-av-container .fallback-av{width:100%;height:100%;border-radius:50%;object-fit:cover;}
.fallback-av{background:var(--purple-light);color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;}
.hdr-online-dot{position:absolute;bottom:0;right:2px;width:10px;height:10px;background:#22c55e;border:2px solid #fff;border-radius:50%;}
.hdr-info{flex:1;}
.hdr-name{font-weight:700;font-size:16px;}
.hdr-status{font-size:12px;color:#22c55e;}
.dropdown-menu{position:absolute;top:45px;right:10px;background:#1e293b;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.3);display:none;flex-direction:column;width:160px;z-index:100;overflow:hidden;}
.dropdown-menu.show{display:flex;}
.dropdown-item{padding:12px 16px;font-size:14px;color:#f1f5f9;background:none;border:none;text-align:left;cursor:pointer;width:100%;font-family:inherit;}
.dropdown-item:hover{background:#334155;}
.dropdown-item.danger{color:#f87171;}
.filter-bar{display:flex;gap:10px;padding:8px 20px 16px;overflow-x:auto;flex-shrink:0;}
.filter-pill{padding:8px 20px;border-radius:20px;background:var(--pill-inactive);color:var(--text2);font-size:14px;font-weight:500;border:none;cursor:pointer;}
.filter-pill.active{background:#7c3aed;color:#fff;}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.chat-item{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;background:#fff;border-bottom:1px solid #f8f9fa;}
.chat-item.unread-style{background:#f5f3ff;}
.item-av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#f1f5f9;}
.item-av-group{width:48px;height:48px;border-radius:50%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;overflow:hidden;background:#e2e8f0;}
.item-av-group img{width:100%;height:100%;object-fit:cover;}
.item-av-icon{width:48px;height:48px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.chat-info{flex:1;}
.chat-name{font-weight:700;font-size:15px;margin-bottom:4px;}
.chat-prev{font-size:13.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-meta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;height:42px;}
.chat-time{font-size:12px;color:var(--text2);}
.badge{background:#7c3aed;color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;}
/* messages */
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:#ffffff;}
.msg{display:flex;flex-direction:column;max-width:75%;}
.msg.out{align-self:flex-end;align-items:flex-end;}
.msg.in{align-self:flex-start;align-items:flex-start;}
.bubble{padding:12px 16px;border-radius:18px;font-size:14.5px;line-height:1.4;position:relative;}
.msg.out .bubble{background:var(--msg-out);border-top-right-radius:4px;}
.msg.in .bubble{background:var(--msg-in);border-top-left-radius:4px;}
.msg-meta-line{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:11px;color:#94a3b8;}
.msg.in .msg-meta-line{justify-content:flex-start;}
.ticks{color:#7c3aed;}
.loc-card{width:260px;border-radius:16px;overflow:hidden;background:#f5f3ff;border:1px solid #e9d5ff;}
.loc-map{height:110px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;}
.loc-desc{padding:10px;}
.loc-title{font-weight:700;font-size:14px;}
.loc-addr{font-size:12px;color:#6d28d9;}
.bubble-reaction{position:absolute;bottom:-12px;left:12px;background:#fff;border:1px solid #f1f5f9;border-radius:12px;padding:2px 8px;font-size:12px;}
.divider{text-align:center;margin:12px 0;position:relative;}
.divider span{background:#f8f9fa;padding:4px 14px;border-radius:20px;font-size:12px;color:#64748b;}
.input-panel{padding:12px 16px;background:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-bottom:calc(12px + env(safe-area-inset-bottom));}
.input-capsule{flex:1;background:#f8f9fa;border-radius:30px;display:flex;align-items:center;padding:4px 6px 4px 14px;gap:6px;border:1px solid #f1f5f9;}
.msg-input{flex:1;background:transparent;border:none;outline:none;font-size:14.5px;font-family:inherit;padding:8px 0;resize:none;max-height:80px;}
.capsule-btn{background:none;border:none;font-size:22px;color:#64748b;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
.action-mic-btn{width:42px;height:42px;border-radius:50%;background:#7c3aed;color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
/* FAB */
.fab-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:999;}
.fab-blur-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.6);backdrop-filter:blur(8px);display:none;z-index:990;}
.fab-blur-overlay.show{display:block;}
.fab-sub-item{display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(20px);pointer-events:none;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);}
.fab-container.open .fab-sub-item{opacity:1;transform:translateY(0);pointer-events:auto;}
.fab-label{background:#fff;color:var(--text);padding:6px 14px;border-radius:20px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.fab-icon-btn{width:44px;height:44px;border-radius:50%;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.fab-main-trigger{width:56px;height:56px;border-radius:50%;background:#7c3aed;border:none;color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(124,58,237,0.4);display:flex;align-items:center;justify-content:center;transition:transform 0.2s;}
.fab-container.open .fab-main-trigger{transform:rotate(45deg);background:#ef4444;}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-card{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:320px;text-align:center;}
.modal-btn{width:100%;padding:12px;border-radius:12px;background:#7c3aed;color:#fff;border:none;font-weight:600;cursor:pointer;margin-top:12px;}
</style>
</head>
<body>
<div class="fab-blur-overlay" id="fabBlur"></div>
<div class="app">
<div class="content">
<!-- Login screen -->
<div class="screen show" id="sLogin">
  <div class="login-logo"><h1>JUSTUS</h1><p>🔒 Private & Secure</p></div>
  <div class="login-card">
    <div class="tabs"><button class="tab on" id="tabLogin">Log In</button><button class="tab" id="tabSignup">Sign Up</button></div>
    <div id="fLogin">
      <div class="field"><label>Email / Username</label><input type="text" id="liUser" placeholder="demo@justus.com" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="liPass" placeholder="••••••"></div>
      <button class="lbtn" id="liBtn">Log In</button>
      <div class="lerr" id="liErr"></div>
    </div>
  </div>
</div>

<!-- Chats listing screen -->
<div class="screen" id="sChats">
  <div class="hdr"><div class="hdr-title-main">Conversations</div><div class="hdr-actions"><button class="hdr-icon-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button></div></div>
  <div class="filter-bar"><button class="filter-pill active" data-filter="all">All</button><button class="filter-pill" data-filter="unread">Unread</button><button class="filter-pill" data-filter="groups">Groups</button><button class="filter-pill" data-filter="starred">Starred</button></div>
  <div style="flex:1;overflow-y:auto" id="chatListContainer"><div id="chatList"></div></div>
  <div class="fab-container" id="fabContainer"><div class="fab-sub-item" data-action="Calls"><span class="fab-label">Calls</span><button class="fab-icon-btn" style="background:#22c55e;">📞</button></div><div class="fab-sub-item" data-action="Status"><span class="fab-label">Status</span><button class="fab-icon-btn" style="background:#a855f7;">📢</button></div><div class="fab-sub-item" data-action="Chats"><span class="fab-label">Chats</span><button class="fab-icon-btn" style="background:#3b82f6;">💬</button></div><button class="fab-main-trigger" id="fabTriggerBtn">+</button></div>
</div>

<!-- Single chat screen -->
<div class="screen" id="sChat">
  <div class="chat-hdr"><button class="hdr-back" id="backChatBtn">←</button><div class="hdr-av-container" id="chatHeaderAv"></div><div class="hdr-info"><div class="hdr-name" id="chatHeaderName">Loading</div><div class="hdr-status" id="chatHeaderStatus">Online</div></div><div class="hdr-actions"><button class="hdr-icon-btn" id="threeDotsBtn">⋮</button><div class="dropdown-menu" id="chatDropdown"><button class="dropdown-item" id="optViewInfo">View Info</button><button class="dropdown-item" id="optMute">Mute</button><button class="dropdown-item danger" id="optBlock">Block</button><button class="dropdown-item" id="optStatus">Their Status</button></div></div></div>
  <div class="msgs" id="msgsContainer"></div>
  <div class="input-panel"><div class="input-capsule"><button class="capsule-btn" id="plusAttachBtn">+</button><textarea class="msg-input" id="msgInput" rows="1" placeholder="Type a message..."></textarea><button class="capsule-btn" id="emojiBtn">😊</button></div><button class="action-mic-btn" id="sendMsgBtn">📨</button></div>
</div>
</div></div>

<div class="modal-overlay" id="infoModal"><div class="modal-card"><h3 id="modalTitle"></h3><p id="modalBody"></p><button class="modal-btn" onclick="closeModal()">Close</button></div></div>

<script>
// Firebase configuration (test mode)
const firebaseConfig = {
  apiKey: "AIzaSyDUHVeaHIMRS8GxkFNEjVSXfUeKr_mQnp0",
  authDomain: "justus-messenger.firebaseapp.com",
  databaseURL: "https://justus-messenger-default-rtdb.firebaseio.com",
  projectId: "justus-messenger",
  storageBucket: "justus-messenger.appspot.com",
  appId: "1:1234567890:web:demo123456"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// app state
let currentUser = null;
let currentChatPartner = null;
let currentMessagesRef = null;
let messageListener = null;
let conversationsRef = null;

// Helper DOM
function go(screenId) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('show')); document.getElementById(screenId).classList.add('show'); }

// render conversation list dynamically
function renderConversations() {
  if(!currentUser) return;
  const container = document.getElementById('chatList');
  if(!container) return;
  const defaultChats = [
    { id: "Lebogang", name: "Lebogang", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150", lastMsg: "See you at 3pm today.", time: "12:45", unread: 2, type: "user" },
    { id: "Allicia_8791", name: "Allicia@8791", avatar: "", lastMsg: "Phendula", time: "15:05", unread: 0, type: "user", initial: "A" },
    { id: "Family", name: "Family", lastMsg: "Mom: Don't forget dinner", time: "11:30", unread: 5, type: "group", groupAvatars: ["https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=80","https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=80","https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80","https://images.unsplash.com/photo-1517841905240-472988babdf9?w=80"] }
  ];
  container.innerHTML = defaultChats.map(chat => {
    let avatarHtml = '';
    if(chat.type === 'group') {
      avatarHtml = `<div class="item-av-group">${chat.groupAvatars.map(url=>`<img src="${url}">`).join('')}</div>`;
    } else if(chat.avatar) {
      avatarHtml = `<img class="item-av" src="${chat.avatar}">`;
    } else {
      avatarHtml = `<div class="item-av-icon" style="background:#e0f2fe;color:#0284c7;">${chat.initial || chat.name.charAt(0)}</div>`;
    }
    const unreadBadge = chat.unread > 0 ? `<div class="badge">${chat.unread}</div>` : '';
    const timeStyle = chat.unread ? 'style="color:#7c3aed; font-weight:500;"' : '';
    return `<div class="chat-item ${chat.unread ? 'unread-style' : ''}" data-chat-id="${chat.id}" data-chat-name="${chat.name}" data-chat-type="${chat.type}" data-avatar="${chat.avatar || ''}" data-group="${chat.type==='group'}">
      ${avatarHtml}
      <div class="chat-info"><div class="chat-name">${chat.name}</div><div class="chat-prev">${chat.lastMsg}</div></div>
      <div class="chat-meta"><div class="chat-time" ${timeStyle}>${chat.time}</div>${unreadBadge}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.chat-item').forEach(el => {
    el.addEventListener('click', (e) => {
      const chatId = el.dataset.chatId;
      const chatName = el.dataset.chatName;
      const avatarUrl = el.dataset.avatar;
      const isGroup = el.dataset.group === 'true';
      openChat(chatId, chatName, avatarUrl, isGroup);
    });
  });
}

// open chat room (real-time)
function openChat(partnerId, displayName, avatarUrl, isGroup=false) {
  if(!currentUser) return;
  currentChatPartner = partnerId;
  document.getElementById('chatHeaderName').innerText = displayName;
  const avatarZone = document.getElementById('chatHeaderAv');
  if(avatarUrl && avatarUrl.length>0) avatarZone.innerHTML = `<img src="${avatarUrl}"><div class="hdr-online-dot"></div>`;
  else avatarZone.innerHTML = `<div class="fallback-av">${displayName.charAt(0)}</div><div class="hdr-online-dot"></div>`;
  document.getElementById('chatHeaderStatus').innerText = "Online · end-to-end encrypted";
  // Build unique chat room ID (deterministic)
  const roomId = [currentUser.uid, partnerId].sort().join('_');
  if(messageListener) messageListener.off();
  const messagesRef = db.ref(`chats/${roomId}/messages`);
  currentMessagesRef = messagesRef;
  const msgsContainer = document.getElementById('msgsContainer');
  msgsContainer.innerHTML = '<div style="text-align:center;padding:20px;">Loading messages...</div>';
  messageListener = messagesRef.orderByChild('timestamp').on('value', (snapshot) => {
    const messages = [];
    snapshot.forEach(child => { messages.push({ id: child.key, ...child.val() }); });
    renderMessages(messages, currentUser.uid);
  });
}

function renderMessages(messages, myUid) {
  const container = document.getElementById('msgsContainer');
  if(!container) return;
  if(!messages.length) { container.innerHTML = '<div class="divider"><span>Start a conversation ✨</span></div>'; return; }
  let html = '<div class="divider"><span>Today</span></div>';
  messages.forEach(msg => {
    const isOut = msg.senderId === myUid;
    const timeStr = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    let bubbleContent = '';
    if(msg.type === 'location') bubbleContent = `<div class="loc-card"><div class="loc-map">📍${msg.text || 'Location'}</div><div class="loc-desc"><span class="loc-title">Shared location</span><span class="loc-addr">${msg.address || 'Nearby'}</span></div></div>`;
    else bubbleContent = `<div class="bubble">${escapeHtml(msg.text)}</div>`;
    let reactionHtml = msg.reaction ? `<div class="bubble-reaction">${msg.reaction}</div>` : '';
    html += `<div class="msg ${isOut ? 'out' : 'in'}"><div class="bubble-wrapper">${bubbleContent}${reactionHtml}</div><div class="msg-meta-line"><span>${timeStr}</span>${isOut ? '<span class="ticks">✓✓</span>' : ''}</div></div>`;
  });
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

// send text message
async function sendMessage(text) {
  if(!currentUser || !currentChatPartner || !text.trim()) return;
  const roomId = [currentUser.uid, currentChatPartner].sort().join('_');
  const msgRef = db.ref(`chats/${roomId}/messages`).push();
  await msgRef.set({
    text: text.trim(),
    senderId: currentUser.uid,
    timestamp: Date.now(),
    type: 'text',
    status: 'sent'
  });
  document.getElementById('msgInput').value = '';
}

// login / signup logic
function setAuthMode(isLogin) { document.getElementById('liErr').innerText = ''; }
document.getElementById('tabLogin').addEventListener('click',()=>{document.getElementById('tabLogin').classList.add('on');document.getElementById('tabSignup').classList.remove('on');window.signupMode=false;});
document.getElementById('tabSignup').addEventListener('click',()=>{document.getElementById('tabSignup').classList.add('on');document.getElementById('tabLogin').classList.remove('on');window.signupMode=true;});
window.signupMode = false;

document.getElementById('liBtn').addEventListener('click', async () => {
  const email = document.getElementById('liUser').value.trim();
  const pass = document.getElementById('liPass').value;
  if(!email || !pass){ document.getElementById('liErr').innerText = 'Fill both fields'; return; }
  document.getElementById('liErr').innerText = '';
  try {
    if(window.signupMode) {
      const userCred = await auth.createUserWithEmailAndPassword(email, pass);
      currentUser = userCred.user;
    } else {
      const userCred = await auth.signInWithEmailAndPassword(email, pass);
      currentUser = userCred.user;
    }
    // post login
    document.getElementById('liErr').innerText = '';
    go('sChats');
    renderConversations();
    // setup presence ping
    if(currentUser) db.ref(`users/${currentUser.uid}/online`).set(true);
  } catch(err) {
    document.getElementById('liErr').innerText = err.message;
  }
});

// logout + cleanup
function logout() { if(currentUser) db.ref(`users/${currentUser.uid}/online`).remove(); if(messageListener) messageListener.off(); currentUser=null; go('sLogin'); }
// back & navigation
document.getElementById('backChatBtn').addEventListener('click', ()=>{ if(messageListener) messageListener.off(); go('sChats'); });
// send message with enter key
const msgInputField = document.getElementById('msgInput');
document.getElementById('sendMsgBtn').addEventListener('click', ()=>{ sendMessage(msgInputField.value); });
msgInputField.addEventListener('keypress', (e)=>{ if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(msgInputField.value); } });
// FAB menu
const fab = document.getElementById('fabContainer'), fabBlur=document.getElementById('fabBlur'), fabTrigger=document.getElementById('fabTriggerBtn');
function closeFab(){ fab.classList.remove('open'); fabBlur.classList.remove('show'); }
fabTrigger.addEventListener('click', (e)=>{ e.stopPropagation(); fab.classList.toggle('open'); fabBlur.classList.toggle('show'); });
fabBlur.addEventListener('click', closeFab);
document.querySelectorAll('.fab-sub-item').forEach(el => { el.addEventListener('click', (e)=>{ e.stopPropagation(); const action = el.dataset.action; closeFab(); openModal('⚡ Action', `You opened "${action}" — feature integrated.`); }); });
// three dots dropdown
const threeBtn = document.getElementById('threeDotsBtn'), dropdown = document.getElementById('chatDropdown');
threeBtn.addEventListener('click', (e)=>{ e.stopPropagation(); dropdown.classList.toggle('show'); });
document.addEventListener('click', ()=>{ dropdown.classList.remove('show'); });
document.getElementById('optViewInfo').addEventListener('click',()=>{ if(currentChatPartner) openModal('Profile', `Username: ${currentChatPartner}\nSecure connection · JUSTUS`); });
document.getElementById('optMute').addEventListener('click',()=>{ openModal('Muted', `Notifications for ${currentChatPartner || 'this chat'} silenced`); });
document.getElementById('optBlock').addEventListener('click',()=>{ openModal('Blocked', `You have blocked ${currentChatPartner || 'user'}.`); });
document.getElementById('optStatus').addEventListener('click',()=>{ openModal('Status', `${currentChatPartner || 'User'} is active and encrypted.`); });
// filter pills basic UI
document.querySelectorAll('.filter-pill').forEach(btn => {
  btn.addEventListener('click', function(){ document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active')); this.classList.add('active'); openModal('Filter','Filtering conversations (demo)'); });
});
// attach plus button (demo location share)
document.getElementById('plusAttachBtn').addEventListener('click', ()=>{
  openModal('Share Location', '📍 Live location sharing would be triggered here.');
});
document.getElementById('emojiBtn').addEventListener('click', ()=>{
  const input = document.getElementById('msgInput');
  input.value += '😊';
  input.focus();
});
window.openModal = (title, text)=>{ document.getElementById('modalTitle').innerText=title; document.getElementById('modalBody').innerText=text; document.getElementById('infoModal').style.display='flex'; };
window.closeModal = ()=> document.getElementById('infoModal').style.display='none';
// optional: online tracking after auth state
auth.onAuthStateChanged(user => { if(user) { currentUser = user; if(document.getElementById('sChats').classList.contains('show')) renderConversations(); } else { if(messageListener) messageListener.off(); } });
// initial demo prefill
document.getElementById('liUser').value = 'demo@justus.com';
document.getElementById('liPass').value = 'demopass';
</script>
</body>
</html>
